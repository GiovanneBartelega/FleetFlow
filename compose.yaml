services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: fleetflow
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - fleetflow_db:/var/lib/mysql
      - ./database/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  fleetflow_db:
